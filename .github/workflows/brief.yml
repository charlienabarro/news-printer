name: Morning brief

on:
  schedule:
    # GitHub often starts scheduled runs late (sometimes by hours) or skips them,
    # especially on the hour/half hour. Several off-peak tries make sure a fresh
    # brief is ready before 8am London time; each run just overwrites brief.txt.
    - cron: "13 3 * * *"
    - cron: "41 4 * * *"
    - cron: "17 5 * * *"
    - cron: "52 5 * * *"
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser google-genai

      - run: python make_brief.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit brief
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add brief.txt
          git commit -m "Brief $(date -u +%F)" || exit 0
          git push
