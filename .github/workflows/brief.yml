name: Morning brief

on:
  # No schedule: GitHub's scheduled runs were starting about 8 hours late.
  # The Pico starts this workflow itself at 07:40 via the API (workflow_dispatch),
  # and you can also run it manually from the Actions tab.
  workflow_dispatch:

concurrency:
  group: brief
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install feedparser google-genai

      - run: python make_brief.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit brief
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add brief.txt
          git commit -m "Brief $(date -u +%F)" || exit 0
          git push
